<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ポスティング記録</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ポスティング">
<meta name="theme-color" content="#0f766e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="lib/maplibre-gl.css">
<style>
:root{--bg:#f4f5f3;--card:#fff;--ink:#1b2430;--sub:#667085;--line:#e8e8e3;--main:#0f766e;--main-ink:#fff;--soft:#e3f3f1;--old:#a7dcd5;--bad:#e2552f;--bad-bg:#fdeee9;--user:#1e2a5a;--shadow:0 6px 20px rgba(23,32,44,.13);--shadow-s:0 2px 8px rgba(23,32,44,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;font-size:16px;font-feature-settings:"palt"}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#map{flex:1;min-height:0}

.top{position:absolute;z-index:5;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;display:flex;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
#searchForm{flex:1;min-width:0;display:flex;align-items:center;background:var(--card);border-radius:14px;box-shadow:var(--shadow)}
#searchForm svg{width:19px;height:19px;margin-left:14px;flex:none;color:var(--sub)}
#searchInput{flex:1;min-width:0;border:0;background:none;padding:0 8px;height:48px;outline:none;font-size:16px}
#searchInput::placeholder{color:#98a2b3}
#searchInput::-webkit-search-cancel-button{display:none}
#searchBtn{padding:0 14px;height:48px;color:var(--main);font-weight:700;font-size:15px}
.round{width:48px;height:48px;flex:none;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center}
.round svg{width:22px;height:22px}

.chips{position:absolute;z-index:4;left:0;right:0;top:calc(env(safe-area-inset-top) + 70px);display:flex;gap:6px;padding:0 12px 6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;display:flex;align-items:center;gap:6px;height:36px;padding:0 10px 0 8px;background:var(--card);border-radius:99px;font-size:12.5px;font-weight:500;color:var(--ink);box-shadow:var(--shadow-s);white-space:nowrap}
.knob{position:relative;width:25px;height:15px;border-radius:99px;background:#d0d5dd;transition:background .15s;flex:none}
.knob::after{content:"";position:absolute;left:2px;top:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:transform .15s}
.chips button[aria-pressed=true] .knob{background:var(--on)}
.chips button[aria-pressed=true] .knob::after{transform:translateX(10px)}
#ovHh{--on:#4f46e5}#ovFar{--on:#ea580c}#ovCar{--on:#db2777}

.corner{position:absolute;z-index:4;left:12px;bottom:calc(env(safe-area-inset-bottom) + 92px);display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none}
.corner>*{pointer-events:auto}
.scale{background:var(--card);border-radius:12px;padding:8px 12px;font-size:12px;color:var(--ink);box-shadow:var(--shadow-s);line-height:1.5}
.scale:empty{display:none}
.scale .bar{display:block;width:172px;height:7px;border-radius:99px;margin:4px 0 3px}
.scale .ends{display:flex;justify-content:space-between;width:172px;color:var(--sub)}
.scale .st{display:flex;align-items:center;gap:6px;margin-top:3px;color:var(--sub)}
.scale .st i{width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px var(--ink);flex:none}
.legend{display:block;text-align:left;color:var(--ink);background:var(--card);border-radius:12px;padding:9px 13px;font-size:13px;line-height:1.85;box-shadow:var(--shadow-s)}
.legend i{display:inline-block;width:13px;height:13px;border-radius:4px;margin-right:8px;vertical-align:-1.5px}
.legend .fold{display:none;font-weight:500;color:var(--ink);line-height:1.4}
.legend.closed{padding:8px 13px}
.legend.closed .rows-l{display:none}
.legend.closed .fold{display:block}
.c-recent{background:#0d9488}.c-old{background:var(--old)}.c-ng{background:var(--bad)}.c-u1{background:var(--user)}.c-u2{background:#fff;box-shadow:inset 0 0 0 2.5px var(--user)}.c-u3{background:#fff;border:1.5px dashed var(--user)}
.c-town{background:rgba(120,124,130,.55)}
.fab{position:absolute;z-index:4;right:12px;bottom:calc(env(safe-area-inset-bottom) + 112px)}

.hint{position:absolute;z-index:4;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 122px);background:rgba(27,36,48,.86);color:#fff;font-size:13px;padding:6px 14px;border-radius:99px;white-space:nowrap;pointer-events:none}
.hint[hidden]{display:none}

.dock{position:relative;z-index:5;background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -4px 18px rgba(23,32,44,.08);padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);display:flex;align-items:center;gap:14px;margin-top:-20px}
.seg{flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-radius:14px;padding:4px;gap:2px}
.seg button{height:46px;border-radius:11px;font-weight:700;font-size:14.5px;color:var(--sub);transition:background .12s}
.seg button[aria-pressed=true]{background:var(--main);color:#fff;box-shadow:var(--shadow-s)}
.seg button.ng[aria-pressed=true]{background:var(--bad)}
.seg button.user[aria-pressed=true]{background:var(--user)}
.count{text-align:center;font-size:11.5px;color:var(--sub);line-height:1.25;min-width:50px}
.count b{display:block;font-size:24px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}

.toast{position:absolute;z-index:6;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 92px);background:#1b2430;color:#fff;border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:8px;min-height:50px;font-size:14.5px;box-shadow:var(--shadow)}
.toast[hidden]{display:none}
.toast span{flex:1;min-width:0}
.toast button{color:#7fe3d3;font-weight:700;padding:10px 12px;white-space:nowrap}
.toast button[hidden]{display:none}

.scrim{position:absolute;inset:0;z-index:9;background:rgba(23,32,44,.42);display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet{position:relative;width:100%;max-width:520px;max-height:84%;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:26px 18px calc(env(safe-area-inset-bottom) + 18px)}
.sheet::before{content:"";position:absolute;left:50%;top:10px;width:38px;height:4px;margin-left:-19px;border-radius:99px;background:#dcdde0}
.sheet h2{font-size:20px;font-weight:700;margin:0 0 4px}
.sheet h3{font-size:13px;margin:20px 0 8px;color:var(--sub);font-weight:700}
.sub{color:var(--sub);font-size:14px;margin:0 0 10px;line-height:1.6}
.btn{display:block;width:100%;min-height:50px;padding:10px;border-radius:14px;font-weight:700;background:var(--soft);color:var(--main);margin-top:8px;text-align:center}
.btn.primary{background:var(--main);color:#fff}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.plain{background:none;color:var(--sub);font-weight:500;min-height:44px}
.btn:disabled{opacity:.45}
.badge{display:inline-block;background:var(--bad-bg);color:var(--bad);font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rows li{display:flex;align-items:center;justify-content:space-between;min-height:46px;border-bottom:1px solid var(--line);gap:8px;font-size:15px}
.rows li button{color:var(--sub);padding:10px;font-size:13.5px}
.empty{color:var(--sub);font-size:14px;padding:6px 0}
.addDate{display:flex;gap:8px;margin-top:8px}
.addDate input{flex:1;min-width:0;height:50px;border:1px solid var(--line);border-radius:14px;padding:0 12px;background:#fff}
.addDate button{min-height:50px;padding:0 16px;border-radius:14px;background:var(--soft);color:var(--main);font-weight:700}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:50px;border-bottom:1px solid var(--line);font-size:15px}
.field select{height:40px;border:1px solid var(--line);border-radius:10px;padding:0 8px;background:#fff}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.checks label{display:flex;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid var(--line);font-size:15px}
.checks input{width:20px;height:20px;accent-color:var(--main);flex:none}
.stick{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--card);padding:6px 0 calc(env(safe-area-inset-bottom) + 18px);margin-bottom:calc(-18px - env(safe-area-inset-bottom))}
.sw{position:relative;width:48px;height:28px;border-radius:99px;background:#d0d5dd;flex:none;font-size:0;transition:background .15s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw[aria-pressed=true]{background:var(--main)}
.sw[aria-pressed=true]::after{transform:translateX(20px)}
.note{font-size:13px;color:var(--sub);line-height:1.7;margin:0 0 8px}
.usage{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.usage button{min-height:50px;padding:4px;border-radius:12px;background:var(--bg);font-size:13px;font-weight:700;color:var(--sub);line-height:1.3}
.usage button[aria-pressed=true]{background:var(--user);color:#fff}
.maplibregl-ctrl-bottom-right{bottom:20px}
.maplibregl-ctrl-attrib{font-size:10px;background:rgba(255,255,255,.7)!important}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div class="dock">
    <div class="seg" role="group" aria-label="押したときの記録">
      <button id="modePost" aria-pressed="true">投函した</button>
      <button id="modeNg" class="ng" aria-pressed="false">お断り</button>
      <button id="modeUser" class="user" aria-pressed="false">利用者</button>
    </div>
    <div class="count">今日<b id="todayCount">0</b></div>
  </div>
</div>

<div class="top">
  <form id="searchForm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg><input id="searchInput" type="search" placeholder="住所で移動（三重県内）" enterkeyhint="search" autocomplete="off"><button id="searchBtn">移動</button></form>
  <button class="round" id="menuBtn" aria-label="メニュー"><svg viewBox="0 0 24 24" fill="none" stroke="#1b2430" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</div>

<div class="chips" role="group" aria-label="地図に重ねる情報">
  <button id="ovHh" aria-pressed="false"><i class="knob"></i>世帯数</button>
  <button id="ovFar" aria-pressed="false"><i class="knob"></i>徒歩圏</button>
  <button id="ovCar" aria-pressed="false"><i class="knob"></i>車の距離</button>
</div>

<button class="round fab" id="locBtn" aria-label="現在地へ移動"><svg viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.6" fill="#0f766e"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>

<div class="corner">
  <div class="scale" id="legendExtra"></div>
  <button class="legend closed" id="legend" aria-label="色の説明を開閉">
    <div class="rows-l">
      <div><i class="c-recent"></i><span id="legendRecent">30日以内</span></div>
      <div><i class="c-old"></i>それより前</div>
      <div><i class="c-ng"></i>お断り</div>
      <div><i class="c-u1"></i>利用中</div>
      <div><i class="c-u2"></i>しばらく利用なし</div>
      <div><i class="c-u3"></i>全然利用なし</div>
      <div><i class="c-town"></i>世帯のある場所</div>
    </div>
    <div class="fold">色の説明</div>
  </button>
</div>

<div class="hint" id="hint" hidden></div>
<div class="toast" id="toast" hidden><span id="toastText"></span><button id="toastBtn"></button></div>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="lib/maplibre-gl.js"></script>
<script>
'use strict';
const KEY_DATA = 'posting-records-v1';
const KEY_VIEW = 'posting-view-v1';
const KEY_DEVICE = 'posting-device-v1';
const KEY_CYCLE = 'posting-cycle-v1';
const KEY_BACKUP = 'posting-last-backup-v1';
const KEY_AREA = 'posting-area-v1';
const KEY_LEGEND = 'posting-legend-closed-v1';
const KEY_OVERLAY = 'posting-overlay-v1';
const USAGE = { active: '利用中', idle: 'しばらく利用なし', gone: '全然利用なし' };
const MIN_TAP_ZOOM = 16.5;   // これより引いた状態では建物が小さく、押し間違いやすい
const TAP_PAD = 7;           // 指の太さ分の許容（px）
const GSI = 'https://cyberjapandata.gsi.go.jp/xyz';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- 記録データ ----------
   records[id] = { id, kind:'bldg'|'pin', geom:GeoJSON, center:[lng,lat],
                   dates:['2026-11-04',...], ng:bool, usage:null|'active'|'idle'|'gone', by:端末ID, updatedAt:ms, deleted?:true }
   id と updatedAt は、後で複数人の共有に移すときの突き合わせに使う。
   削除も deleted 印で残し、バックアップの読み込みで復活しないようにする。 */
let records = {};
function load() { try { records = JSON.parse(localStorage.getItem(KEY_DATA)) || {}; } catch (e) { records = {}; } }
function save() {
  try { localStorage.setItem(KEY_DATA, JSON.stringify(records)); return true; }
  catch (e) { alert('保存できませんでした。端末の空き容量を確認し、メニューからバックアップを保存してください。'); return false; }
}
const live = () => Object.values(records).filter(r => !r.deleted);
function deviceId() {
  let d = null;
  try { d = localStorage.getItem(KEY_DEVICE); } catch (e) {}
  if (!d) { d = uuid(); try { localStorage.setItem(KEY_DEVICE, d); } catch (e) {} }
  return d;
}
function uuid() { return crypto.randomUUID ? crypto.randomUUID() : 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2); }
function ymd(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fmt(s) { const [y, m, d] = s.split('-').map(Number); const w = '日月火水木金土'[new Date(y, m - 1, d).getDay()]; return `${y}年${m}月${d}日（${w}）`; }
function short(s) { const [, m, d] = s.split('-').map(Number); return `${m}月${d}日`; }
function touch(r) { r.updatedAt = Date.now(); r.by = deviceId(); }
function lastDate(r) { return r.dates.length ? r.dates.reduce((a, b) => a > b ? a : b) : null; }
function cycleDays() { let v = 30; try { v = Number(localStorage.getItem(KEY_CYCLE)) || 30; } catch (e) {} return v; }
// 塗りは投函の状態、縁取りは過去の利用者。縁取りなら内側の投函の色が隠れない
function ringOf(r) { return r.usage === 'idle' || r.usage === 'gone' ? r.usage : ''; }
function stateOf(r) {
  if (r.ng) return 'ng';
  if (r.usage === 'active') return 'active';
  const l = lastDate(r);
  if (!l) return 'none';
  const [y, m, d] = l.split('-').map(Number);
  const days = Math.round((new Date(new Date().toDateString()) - new Date(y, m - 1, d)) / 864e5);
  return days <= cycleDays() ? 'recent' : 'old';
}

/* ---------- 地図 ---------- */
const MIE_BOUNDS = [[135.6, 33.5], [137.2, 35.45]]; // 三重県と少しの余白
let view = { center: [136.5, 34.55], zoom: 8.5 };
let hasSavedView = false;
try { const v = JSON.parse(localStorage.getItem(KEY_VIEW)); if (v && v.center) { view = v; hasSavedView = true; } } catch (e) {}

const COLOR = ['match', ['get', 'state'], 'recent', '#0d9488', 'old', '#a7dcd5', 'ng', '#e2552f', 'active', '#1e2a5a', '#ffffff'];
const ROAD = (a, b, c) => ['interpolate', ['exponential', 1.7], ['zoom'], 9, a, 14, b, 18, c];
const PLACES = [110, 120, 130, 140, 210, 220]; // 山や川の名前は出さない
const STATIONS = [411, 412, 413, 421, 422, 423];
const KIND = (...k) => ['in', ['get', 'vt_rdctg'], ['literal', k]];
const map = new maplibregl.Map({
  container: 'map', center: view.center, zoom: view.zoom, maxZoom: 20, minZoom: 7.5, maxBounds: MIE_BOUNDS,
  dragRotate: false, pitchWithRotate: false, touchPitch: false, attributionControl: false,
  style: {
    version: 8,
    glyphs: 'https://gsi-cyberjapan.github.io/optimal_bvmap/glyphs/{fontstack}/{range}.pbf',
    sources: {
      gsi: { type: 'vector', tiles: [GSI + '/optimal_bvmap-v1/{z}/{x}/{y}.pbf'], minzoom: 4, maxzoom: 16,
        attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>・<a href="https://nlftp.mlit.go.jp/ksj/" target="_blank" rel="noopener">国土数値情報</a>・<a href="https://www.e-stat.go.jp/" target="_blank" rel="noopener">国勢調査</a>を加工・<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>' },
      dots: { type: 'geojson', buffer: 512, data: { type: 'FeatureCollection', features: [] } },
      cells: { type: 'geojson', data: { type: 'FeatureCollection', features: [] } },
      fine: { type: 'geojson', data: { type: 'FeatureCollection', features: [] } },
      stores: { type: 'geojson', data: { type: 'FeatureCollection', features: [] } },
      areaDim: { type: 'geojson', data: { type: 'FeatureCollection', features: [] } },
      areaMine: { type: 'geojson', data: { type: 'FeatureCollection', features: [] } },
      records: { type: 'geojson', data: { type: 'FeatureCollection', features: [] } },
      recordDots: { type: 'geojson', data: { type: 'FeatureCollection', features: [] } }
    },
    layers: [
      // 山や等高線は描かず、道路と水面と地名だけのすっきりした地図にする
      { id: 'land', type: 'background', paint: { 'background-color': '#eff0ec' } },
      { id: 'water', type: 'fill', source: 'gsi', 'source-layer': 'WA', paint: { 'fill-color': '#c9e0ec' } },
      { id: 'water2', type: 'fill', source: 'gsi', 'source-layer': 'WStrA', paint: { 'fill-color': '#c9e0ec' } },
      { id: 'river', type: 'line', source: 'gsi', 'source-layer': 'RvrCL', minzoom: 13, paint: { 'line-color': '#c9e0ec', 'line-width': 1.2 } },
      { id: 'adm', type: 'line', source: 'gsi', 'source-layer': 'AdmBdry', maxzoom: 13, paint: { 'line-color': '#c6c8c4', 'line-width': 1, 'line-dasharray': [3, 2] } },
      // 全ての建物が入っているのは16のタイルだけなので、それより小さい縮尺では世帯のある場所を灰色で出す。
      // 密集地は濃く、点在地は点々に見える
      { id: 'town', type: 'heatmap', source: 'dots', maxzoom: 16.5,
        paint: { 'heatmap-radius': ['interpolate', ['exponential', 2], ['zoom'], 8, 3.4, 16, 300], 'heatmap-weight': ['interpolate', ['linear'], ['get', 'h'], 0, .12, 60, .7], 'heatmap-intensity': .9,
          'heatmap-color': ['interpolate', ['linear'], ['heatmap-density'], 0, 'rgba(120,124,130,0)', .1, 'rgba(120,124,130,.13)', .45, 'rgba(120,124,130,.3)', 1, 'rgba(100,104,112,.5)'],
          'heatmap-opacity': ['interpolate', ['linear'], ['zoom'], 15.5, 1, 16.5, 0] } },
      { id: 'road-minor-case', type: 'line', source: 'gsi', 'source-layer': 'RdCL', minzoom: 14, filter: KIND('市区町村道等', 'その他'), layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#dcdcd5', 'line-width': ROAD(1, 3.4, 15) } },
      { id: 'road-minor', type: 'line', source: 'gsi', 'source-layer': 'RdCL', minzoom: 12, filter: KIND('市区町村道等', 'その他'), layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#ffffff', 'line-width': ROAD(.4, 2.2, 12.5) } },

/* ---------- 世帯数とスーパーまでの距離 ----------
   令和2年国勢調査の500mメッシュを1km四方にまとめてヒートマップにし、拡大すると500m四方の塗りに切り替える。
   1km四方の距離の区分は、その中で世帯が最も多い区分にする。距離はどちらも最寄りのスーパーまでの直線距離。 */
const HH_BANDS = [100, 300, 1000]; // 100以上は区画の上位40%で世帯の92%、1000以上は上位7%で世帯の47%
const WALK_BANDS = [800];          // 国交省「都市構造の評価に関するハンドブック」の生活サービスの徒歩圏
const CAR_BANDS = [3000, 5000];    // 公的な基準はなく、県の世帯のうち店から遠い側の約10%と約5%にあたる距離
const NEAR_INFO_KEY = 'posting-near-info-v1';
let overlay = '';
let meshRows = null;   // コード → [世帯数, 65歳以上人口, 市町の番号]
let meshCities = [];
let storeList = null;  // [経度, 緯度, 名前]
function meshCode(lng, lat) {
  const la = lat * 1.5, p = Math.floor(la), la1 = (la - p) * 8, q = Math.floor(la1), la2 = (la1 - q) * 10, r = Math.floor(la2), la3 = la2 - r;

}
function meshCorner(c) {

}
function nearestStore(lng, lat) {
  let best = null, bd = Infinity;
  const kx = 111320 * Math.cos(lat * Math.PI / 180), ky = 110940;
  for (const s of storeList) {
    const d = ((s[0] - lng) * kx) ** 2 + ((s[1] - lat) * ky) ** 2;

}
const band = (v, list) => list.filter(t => v >= t).length;

  const d = (await fetch('data/mie-dots.json').then(r => r.json())).dots;
  const features = [];
  for (let i = 0; i < d.length; i += 3) features.push({ type: 'Feature', geometry: { type: 'Point', coordinates: [d[i], d[i + 1]] }, properties: { h: d[i + 2] } });
  map.getSource('dots').setData({ type: 'FeatureCollection', features });
}
async function loadOverlayData() {
  const [m, st] = await Promise.all([fetch('data/mie-mesh.json').then(r => r.json()), fetch('data/stores.json').then(r => r.json())]);
  storeList = st.stores;
  meshCities = m.cities;
  meshRows = new Map();
  const cells = new Map(); // 1km区画のコード（500mコードの先頭8桁） → 世帯数と、距離の区分ごとの世帯数
  const fine = [];
  for (const [code, hh, old, kids, city] of m.rows) {
    meshRows.set(code, [hh, old, city, kids]);
    const [x, y] = meshCorner(code);
    const key = code.slice(0, 8);
    const c = cells.get(key) || { hh: 0, walk: [0, 0], car: [0, 0, 0] };
    const d = nearestStore(x + 1 / 320, y + 1 / 480).meters;
    const f = band(d, WALK_BANDS), k = band(d, CAR_BANDS);
    c.hh += hh;
    c.walk[f] += hh;
    c.car[k] += hh;
    cells.set(key, c);
    fine.push({ key, x, y, f, k });
  }
  const top = a => a.indexOf(Math.max(...a));
  const features = [...cells].map(([key, c]) => {
    const [x, y] = meshCorner(key + '1');
    return { type: 'Feature', geometry: { type: 'Point', coordinates: [x + 1 / 160, y + 1 / 240] },
      properties: { h: band(c.hh, HH_BANDS), f: top(c.walk), k: top(c.car) } };
  });
  const w = 1 / 160, h = 1 / 240;
  map.getSource('fine').setData({ type: 'FeatureCollection', features: fine.map(r => (
    { type: 'Feature', geometry: { type: 'Polygon', coordinates: [[[r.x, r.y], [r.x + w, r.y], [r.x + w, r.y + h], [r.x, r.y + h], [r.x, r.y]]] },
      properties: { h: band(cells.get(r.key).hh, HH_BANDS), f: r.f, k: r.k } })) });
  map.getSource('cells').setData({ type: 'FeatureCollection', features });
  map.getSource('stores').setData({ type: 'FeatureCollection', features: storeList.map(s => ({ type: 'Feature', geometry: { type: 'Point', coordinates: [s[0], s[1]] }, properties: { name: s[2] || '' } })) });
}

function nearHtml(r) {

function areaHouseholds() {

/* ---------- 建物の形 ---------- */
const round6 = n => Math.round(n * 1e6) / 1e6;
function roundCoords(c) { return typeof c[0] === 'number' ? [round6(c[0]), round6(c[1])] : c.map(roundCoords); }
function outerRings(g) { return g.type === 'Polygon' ? [g.coordinates[0]] : g.coordinates.map(p => p[0]); }
function ringArea(pts) { let s = 0; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; s += a[0] * b[1] - b[0] * a[1]; } return Math.abs(s) / 2; }
function centerOf(g) {
  // 建物の中心。複数に分かれた形なら一番大きい部分を使う
  const ring = outerRings(g).sort((a, b) => ringArea(b) - ringArea(a))[0];
  const n = ring.length - 1 || 1; let x = 0, y = 0;
  for (let i = 0; i < n; i++) { x += ring[i][0]; y += ring[i][1]; }
  return [round6(x / n), round6(y / n)];
}
function inRing(p, ring) {
  let hit = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > p[1]) !== (yj > p[1]) && p[0] < (xj - xi) * (p[1] - yi) / (yj - yi) + xi) hit = !hit;
  }
  return hit;
}
function pickBuilding(point, lnglat) {
  const box = [[point.x - TAP_PAD, point.y - TAP_PAD], [point.x + TAP_PAD, point.y + TAP_PAD]];
  const found = map.queryRenderedFeatures(box, { layers: ['bldg'] });
  if (!found.length) return null;
  const p = [lnglat.lng, lnglat.lat];
  // 形が重なる場所では小さいほうの家を選ぶ（大きい建物の中の小さい家も押せるように）
  const size = f => outerRings(f.geometry).reduce((n, r) => n + ringArea(r), 0);
  const inside = found.filter(f => outerRings(f.geometry).some(r => inRing(p, r))).sort((a, b) => size(a) - size(b))[0];
  if (inside) return inside;
  const d = f => { const c = centerOf(f.geometry); return (c[0] - p[0]) ** 2 + (c[1] - p[1]) ** 2; };
  return found.sort((a, b) => d(a) - d(b))[0];
}

function bboxOf(g) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const walk = c => { if (typeof c[0] === 'number') { x0 = Math.min(x0, c[0]); x1 = Math.max(x1, c[0]); y0 = Math.min(y0, c[1]); y1 = Math.max(y1, c[1]); } else c.forEach(walk); };
  walk(g.coordinates);
  return [x0, y0, x1, y1];
}
const ringsOf = g => g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
function overlaps(a, b) {
  const has = (from, to) => outerRings(from).some(ring => ring.some(p => outerRings(to).some(r => inRing(p, r))));
  return has(a, b) || has(b, a);
}
// 地図データは約500m四方で区切られ、区切りから外へ80（タイル座標）の位置で形が切られる。
// 隣の家とは形がわずかに重なることが多いので、重なりだけでは同じ建物と判断しない。
// 切れ目まで届いた形と、隣のタイルで反対側の切れ目まで届いた形だけをつなげる。
const CLIP = 80;
const SIDES = { w: [-1, 0, 'e'], e: [1, 0, 'w'], n: [0, -1, 's'], s: [0, 1, 'n'] };
function clippedSides(f) {
  const v = f._vectorTileFeature;
  if (!v) return null;
  const pts = v.loadGeometry().flat(), xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  return { w: Math.min(...xs) <= -CLIP, e: Math.max(...xs) >= v.extent + CLIP, n: Math.min(...ys) <= -CLIP, s: Math.max(...ys) >= v.extent + CLIP };
}
function wholeBuilding(f) {
  const sides = clippedSides(f);
  if (!sides || !Object.values(sides).some(Boolean)) return f.geometry;
  const EPS = 1e-5; // 約1m
  const box = bboxOf(f.geometry);
  const a = map.project([box[0], box[1]]), b = map.project([box[2], box[3]]);
  const near = map.queryRenderedFeatures([[a.x - 2, b.y - 2], [b.x + 2, a.y + 2]], { layers: ['bldg'] });
  const parts = ringsOf(f.geometry);
  for (const g of near) {
    for (const [side, [dx, dy, opposite]] of Object.entries(SIDES)) {
      const fv = f._vectorTileFeature, gv = g._vectorTileFeature;
      if (!sides[side] || !gv || gv._x !== fv._x + dx || gv._y !== fv._y + dy || !overlaps(f.geometry, g.geometry)) continue;
      const q = bboxOf(g.geometry);
      // 隣のタイルに建物全体が入っているなら、そちらの形をそのまま使う
      if (q[0] <= box[0] + EPS && q[1] <= box[1] + EPS && q[2] >= box[2] - EPS && q[3] >= box[3] - EPS) return g.geometry;
      const other = clippedSides(g);
      if (other && other[opposite]) parts.push(...ringsOf(g.geometry));
    }
  }
  return parts.length === 1 ? { type: 'Polygon', coordinates: parts[0] } : { type: 'MultiPolygon', coordinates: parts };
}

  $('modePost').setAttribute('aria-pressed', m === 'post');
  $('modeNg').setAttribute('aria-pressed', m === 'ng');
  $('modeUser').setAttribute('aria-pressed', m === 'user');
}
function addRecord(kind, geom, center) {
  const today = ymd();
  const r = { id: uuid(), kind, geom, center, dates: mode === 'post' ? [today] : [], ng: mode === 'ng', usage: mode === 'user' ? 'active' : null };
  touch(r);
  records[r.id] = r;
  if (!save()) { delete records[r.id]; return; }
  draw();
  const done = { ng: 'お断りとして記録しました', user: '利用中として記録しました', post: `${short(today)}の投函を記録しました` }[mode];
  toast(done, '取り消す', () => {
    delete records[r.id]; save(); draw();
  });
}
function recordAt(point) {
  // 色の付いた家に近い場所を押しても、隣の家を記録できるように面は押した点だけで判定する
  const box = [[point.x - 5, point.y - 5], [point.x + 5, point.y + 5]];
  const f = map.queryRenderedFeatures([point.x, point.y], { layers: ['rec-fill'] })[0] ||
    map.queryRenderedFeatures(box, { layers: ['rec-dot'] })[0];
  return f ? records[f.properties.id] : null;
}
map.on('click', e => {
  hideToast();
  const existing = recordAt(e.point);
  if (existing) { openRecord(existing); return; }
  if (map.getZoom() < MIN_TAP_ZOOM) { toast('もう少し拡大してから押してください'); return; }
  const f = pickBuilding(e.point, e.lngLat);
  if (f) {
    const whole = wholeBuilding(f);
    const geom = { type: whole.type, coordinates: roundCoords(whole.coordinates) };
    addRecord('bldg', geom, centerOf(geom));
  } else {
    // 新築などで建物データがない場所はピンで残せるようにする
    const c = [round6(e.lngLat.lng), round6(e.lngLat.lat)];
    toast('ここに建物データがありません', 'ピンで記録', () => addRecord('pin', { type: 'Point', coordinates: c }, c));
  }
});

/* ---------- お知らせ ---------- */
let toastTimer = 0, toastAction = null;
function toast(text, label, action) {
  $('toastText').textContent = text;
  $('toastBtn').hidden = !label;
  $('toastBtn').textContent = label || '';
  toastAction = action || null;
  $('toast').hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 5000);
}
function hideToast() { $('toast').hidden = true; toastAction = null; }
$('toastBtn').onclick = () => { const a = toastAction; hideToast(); if (a) a(); };

/* ---------- 建物ごとの記録画面 ---------- */
function openSheet(html) { $('sheet').innerHTML = html; $('scrim').hidden = false; }
function closeSheet() { $('scrim').hidden = true; $('sheet').innerHTML = ''; }
$('scrim').addEventListener('click', e => { if (e.target === $('scrim')) closeSheet(); });

function changed(r) { touch(r); save(); draw(); openRecord(r); }
function openRecord(r) {
  const today = ymd();
  const dates = [...r.dates].sort().reverse();
  openSheet(`
    <h2>${r.kind === 'pin' ? 'ピンの記録' : '建物の記録'}</h2>
    <p class="sub">${dates.length ? `投函 ${dates.length}回・最後は${esc(fmt(dates[0]))}` : '投函の記録はありません'}</p>
    ${r.ng ? '<p><span class="badge">お断り</span></p>' : ''}
    ${nearHtml(r)}
    <h3>ご利用の状況</h3>
    <div class="usage" role="group" aria-label="ご利用の状況">
      <button data-usage="" aria-pressed="${!USAGE[r.usage]}">なし</button>
      ${Object.entries(USAGE).map(([k, v]) => `<button data-usage="${k}" aria-pressed="${r.usage === k}">${v.replace('利用なし', '<br>利用なし')}</button>`).join('')}
    </div>
    <h3>投函</h3>
    <button class="btn primary" id="rToday" ${r.dates.includes(today) ? 'disabled' : ''}>${r.dates.includes(today) ? '今日は記録済みです' : '今日も投函した'}</button>
    <div class="addDate"><input type="date" id="rDate" max="${today}" aria-label="投函した日"><button id="rAdd">別の日を追加</button></div>
    <h3>投函した日</h3>
    ${dates.length ? `<ul class="rows">${dates.map(d => `<li><span>${esc(fmt(d))}</span><button data-del="${esc(d)}">取り消す</button></li>`).join('')}</ul>` : '<p class="empty">まだありません</p>'}
    <button class="btn ${r.ng ? '' : 'danger'}" id="rNg">${r.ng ? 'お断りを解除' : 'お断りにする'}</button>
    <button class="btn plain" id="rRemove">この記録をすべて消す</button>
    <button class="btn plain" id="rClose">閉じる</button>`);
  $('rToday').onclick = () => { r.dates.push(today); changed(r); };
  $('rAdd').onclick = () => {
    const v = $('rDate').value;
    if (!v) return;
    if (v > today) { toast('未来の日付は記録できません'); return; }
    if (!r.dates.includes(v)) r.dates.push(v);
    changed(r);
  };
  // 投函もお断りも利用状況もなくなった記録は残さない
  const settle = () => {
    if (!r.dates.length && !r.ng && !r.usage) { r.deleted = true; r.geom = null; touch(r); save(); draw(); closeSheet(); return; }
    changed(r);
  };
  $('rNg').onclick = () => { r.ng = !r.ng; settle(); };
  $('sheet').querySelectorAll('[data-usage]').forEach(b => b.onclick = () => { r.usage = b.dataset.usage || null; settle(); });
  $('rRemove').onclick = () => {
    if (!confirm('この建物の記録をすべて消しますか？')) return;
    r.deleted = true; r.dates = []; r.geom = null; touch(r); save(); draw(); closeSheet();
  };
  $('rClose').onclick = closeSheet;
  $('sheet').querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    r.dates = r.dates.filter(d => d !== b.dataset.del);
    settle();
  });
}

/* ---------- メニュー ---------- */
function openMenu() {
  const byDay = {};
  let ng = 0;
  for (const r of live()) { if (r.ng) ng++; r.dates.forEach(d => byDay[d] = (byDay[d] || 0) + 1); }
  const days = Object.keys(byDay).sort().reverse();
  let last = null; try { last = localStorage.getItem(KEY_BACKUP); } catch (e) {}
  openSheet(`
    <h2>記録の一覧</h2>
    <p class="sub">記録した建物 ${live().length}件・お断り ${ng}件<br>${Object.entries(USAGE).map(([k, v]) => `${v} ${live().filter(r => r.usage === k).length}件`).join('・')}</p>
    <h3>日ごとの投函数</h3>
    ${days.length ? `<ul class="rows">${days.slice(0, 60).map(d => `<li><span>${esc(fmt(d))}</span><b>${byDay[d]}軒</b></li>`).join('')}</ul>` : '<p class="empty">まだ記録がありません</p>'}
    <h3>担当エリア</h3>
    <p class="sub">${area.length ? esc(areaNames()) + (areaHouseholds() ? `<br>世帯数 約${areaHouseholds().toLocaleString()}世帯（2020年国勢調査）` : '') : '未登録です。登録すると担当外の地図が暗くなります。'}</p>
    <button class="btn" id="mArea">担当エリアを${area.length ? '変更' : '登録'}</button>
    ${area.length ? '<button class="btn" id="mFit">担当エリア全体を見る</button>' : ''}
    <h3>色分け</h3>
    <div class="field"><span>投函済みの濃い色にする期間</span><select id="mCycle">${[14, 30, 60, 90, 180].map(n => `<option value="${n}" ${n === cycleDays() ? 'selected' : ''}>${n}日以内</option>`).join('')}</select></div>
    <h3>地図の追加情報</h3>
    <div class="field"><span>世帯数の濃淡</span><button class="sw" id="swHh" aria-pressed="${overlay === 'hh'}">${overlay === 'hh' ? 'ON' : 'OFF'}</button></div>
    <div class="field"><span>スーパーの徒歩圏</span><button class="sw" id="swFar" aria-pressed="${overlay === 'far'}">${overlay === 'far' ? 'ON' : 'OFF'}</button></div>
    <div class="field"><span>スーパーまでの車の距離</span><button class="sw" id="swCar" aria-pressed="${overlay === 'car'}">${overlay === 'car' ? 'ON' : 'OFF'}</button></div>
    <div class="field"><span>家を押したときの周辺情報</span><button class="sw" id="swNear" aria-pressed="${nearInfoOn()}">${nearInfoOn() ? 'ON' : 'OFF'}</button></div>
    <p class="note">スーパーの表示は、色が濃いほど近く、薄いほど遠い場所です。人が住んでいない区画には色が付きません。</p>
    <h3>データの根拠</h3>
    <p class="note">世帯数：令和2年国勢調査の500mメッシュ（e-Stat）を集計。三重県の合計は736,935世帯で、県公表の確定値742,598世帯の99.2%です。100世帯以上の1km四方は区画の上位40%で世帯の92%、1,000世帯以上は上位7%で世帯の47%が住んでいます。<br>
    スーパー：主要12グループの公式店舗一覧192店（2026年11月4日確認）にOpenStreetMapを統合。スーパーサンシ、バロー、マルヤス、Aコープなど公式一覧を取得できなかった店はOpenStreetMapの情報のため、抜けがあります。コンビニとドラッグストアは含みません。住所の一部は町名までの位置です。<br>
    縮小時の灰色：令和2年国勢調査の250mメッシュの世帯数です。建物そのものではなく、世帯のある場所を示します。世帯の少ない区画は秘匿のため隣に合算されている場合があります。<br>
    徒歩圏：800mは国土交通省「都市構造の評価に関するハンドブック」の生活サービス施設の徒歩圏です。高齢の方の食料品アクセスの基準はより短い500mです（農林水産政策研究所）。<br>
    車の距離：公的な基準はないので、3kmと5kmは県の世帯のうち店から遠い側の約10%と約5%にあたる目安です。距離はどちらも直線で、道のりはこれより長くなります</p>
    <h3>バックアップ</h3>
    <p class="sub">記録はこのスマホの中だけにあります。機種変更やブラウザのデータ消去に備えて、ときどき保存してください。${last ? `前回は${esc(short(last))}に保存しました。` : ''}</p>
    <button class="btn" id="mExport">バックアップを保存</button>
    <button class="btn" id="mImport">バックアップを読み込む</button>
    <button class="btn plain" id="mClose">閉じる</button>`);
  $('mCycle').onchange = e => { try { localStorage.setItem(KEY_CYCLE, e.target.value); } catch (x) {} setLegend(); draw(); };
  $('mArea').onclick = openArea;
  $('swHh').onclick = () => { setOverlay(overlay === 'hh' ? '' : 'hh'); openMenu(); };
  $('swFar').onclick = () => { setOverlay(overlay === 'far' ? '' : 'far'); openMenu(); };
  $('swCar').onclick = () => { setOverlay(overlay === 'car' ? '' : 'car'); openMenu(); };
  $('swNear').onclick = () => { try { localStorage.setItem(NEAR_INFO_KEY, nearInfoOn() ? 'off' : 'on'); } catch (e) {} openMenu(); };
  if ($('mFit')) $('mFit').onclick = () => { closeSheet(); fitArea(); };
  $('mExport').onclick = exportData;
  $('mImport').onclick = () => $('importFile').click();
  $('mClose').onclick = closeSheet;
}
function openArea() {
  if (!cityData) { toast('市町のデータを読み込めていません。通信状況を確認してください'); return; }
  openSheet(`
    <h2>担当エリア</h2>
    <p class="sub">担当の市町を選んでください。担当外でも記録はできます。</p>
    <div class="checks">${cityData.cities.features.map(f => `<label><input type="checkbox" value="${esc(f.properties.code)}" ${area.includes(f.properties.code) ? 'checked' : ''}>${esc(f.properties.name)}</label>`).join('')}</div>
    <div class="stick"><button class="btn primary" id="aSave">保存</button><button class="btn plain" id="aBack">戻る</button></div>`);
  $('aSave').onclick = () => {
    setArea([...$('sheet').querySelectorAll('input:checked')].map(c => c.value));
    closeSheet();
    fitArea();
    toast(area.length ? '担当エリアを保存しました' : '担当エリアを解除しました');
  };
  $('aBack').onclick = openMenu;
}
function setLegend() { $('legendRecent').textContent = cycleDays() + '日以内'; }
function exportData() {
  const blob = new Blob([JSON.stringify({ app: 'posting-records', v: 1, exportedAt: new Date().toISOString(), area, records }, null, 0)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ポスティング記録_${ymd()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  try { localStorage.setItem(KEY_BACKUP, ymd()); } catch (e) {}
  toast('バックアップを保存しました');
}
function validRecord(r) {
  return r && typeof r.id === 'string' && (r.kind === 'bldg' || r.kind === 'pin') && Array.isArray(r.dates) &&
    r.dates.every(d => /^\d{4}-\d{2}-\d{2}$/.test(d)) && (r.deleted || (r.geom && Array.isArray(r.center)));
}
$('importFile').onchange = async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'posting-records' || !data.records) throw new Error('format');
    let added = 0;
    // 同じ記録は更新日時が新しいほうを残すので、読み込んでも手元の新しい記録は消えない
    for (const [id, r] of Object.entries(data.records)) {
      if (!validRecord(r) || r.id !== id) continue;
      if (!records[id] || (r.updatedAt || 0) > (records[id].updatedAt || 0)) { records[id] = r; added++; }
    }
    save(); draw(); closeSheet();
    // 手元の設定を優先し、未登録のときだけバックアップの担当エリアを使う
    if (!area.length && Array.isArray(data.area)) setArea(data.area.filter(c => typeof c === 'string'));
    toast(`${added}件を読み込みました`);
  } catch (x) { toast('このファイルは読み込めません'); }
};

/* ---------- 移動 ---------- */
$('searchForm').onsubmit = async e => {
  e.preventDefault();
  const q = $('searchInput').value.trim();
  if (!q) return;
  $('searchInput').blur();
  try {
    const full = q.startsWith('三重県') ? q : '三重県' + q;
    const res = await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + encodeURIComponent(full));
    const hit = (await res.json()).find(x => x.properties.title.startsWith('三重県') && x.properties.title !== '三重県');
    if (!hit) { toast('三重県内で見つかりませんでした'); return; }
    map.jumpTo({ center: hit.geometry.coordinates, zoom: 17 });
    toast(hit.properties.title);
  } catch (x) { toast('検索できませんでした。通信状況を確認してください'); }
};
$('locBtn').onclick = () => { if (!geo.trigger()) toast('現在地を取得できませんでした'); };
geo.on('error', () => toast('現在地を取得できません。位置情報の許可を確認してください'));
$('menuBtn').onclick = openMenu;
$('modePost').onclick = () => setMode('post');
$('modeNg').onclick = () => setMode('ng');
$('modeUser').onclick = () => setMode('user');
$('ovHh').onclick = () => setOverlay(overlay === 'hh' ? '' : 'hh');
$('ovFar').onclick = () => setOverlay(overlay === 'far' ? '' : 'far');
$('ovCar').onclick = () => setOverlay(overlay === 'car' ? '' : 'car');
$('legend').onclick = () => {
  const closed = $('legend').classList.toggle('closed');
  try { localStorage.setItem(KEY_LEGEND, closed ? '' : 'open'); } catch (e) {}
};
try { if (localStorage.getItem(KEY_LEGEND) === 'open') $('legend').classList.remove('closed'); } catch (e) {}

load();
setLegend();
updateCount();
map.on('load', () => {
  draw();
  updateHint();
  loadDots().catch(() => {});
  loadOverlayData().then(() => {
    let o = ''; try { o = localStorage.getItem(KEY_OVERLAY) || ''; } catch (e) {}
    if (o) setOverlay(o);
  }).catch(() => { $('ovHh').disabled = $('ovFar').disabled = true; });
  loadCities().then(() => {
    if (!hasSavedView) { if (area.length) fitArea(); else geo.trigger(); }
    if (!area.length && !live().length) toast('メニューから担当エリアを登録できます');
  }).catch(() => { if (!hasSavedView) geo.trigger(); });
});
map.on('moveend', saveView);
map.on('zoom', updateHint);
// 日付が変わっても開いたままのとき、色と今日の件数を直す
document.addEventListener('visibilitychange', () => { if (!document.hidden && map.loaded()) draw(); });
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
</body>
